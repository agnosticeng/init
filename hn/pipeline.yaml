Engine:
  Local:
    Bundles:
      - https://github.com/agnosticeng/icepq/releases/download/v0.2.0/icepq_clickhouse_udf_bundle_0.2.0_{{ .GO_TARGET | default "linux_amd64_v3" }}.tar.gz

    Logging:
      DiscardSources:
        - AwsAuthSTSAssumeRoleWebIdentityCredentialsProvider
    Settings:
      send_logs_level: warning
      enable_named_columns_in_function_tuple: 1
      schema_inference_make_columns_nullable: auto
      input_format_parquet_use_native_reader: 1
      output_format_parquet_string_as_string: 0
      output_format_parquet_use_custom_encoder: 1
      output_format_parquet_write_page_index: 1
      output_format_parquet_write_bloom_filter: 1
      output_format_parquet_parallel_encoding: 0
      allow_experimental_insert_into_iceberg: 1 
      write_full_path_in_iceberg_metadata: 1
      max_execution_time: 3600
Init:
  Queries:
    - init_start#ignore-error-codes=8888

Source:
  Query: source
  PollInterval: 30s

Stages:
  - Execute:
      Queries:
        - fetch_range

  - Buffer:
      Enter: create_buffer
      Leave: rename_buffer
      Condition: condition
      Queries:
        - insert_into_buffer
        - drop_range
        - output_merged_range_vars
      MaxDuration: 120s

  - Execute:
      Queries:
        - write_parquet_file
        - iceberg_commit
        - drop_buffer
      ClickhouseSettings:
        max_threads: 1
        max_insert_threads: 1
        max_block_size: 32768
        min_insert_block_size_rows: 0
        min_insert_block_size_bytes: 33554432
